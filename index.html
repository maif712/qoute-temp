<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancy Daily Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">Quotastic</a>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link active-link">Home</a></li>
                    <li class="nav__item"><a href="dashboard.html" class="nav__link">Dashboard</a></li>
                    <li class="nav__item"><a href="create.html" class="nav__link">Create</a></li>
                </ul>
                <div class="nav__close" id="nav-close"><i class="fas fa-times"></i></div>
            </div>
            <div class="nav__toggle" id="nav-toggle"><i class="fas fa-bars"></i></div>
        </nav>
    </header>

    <main class="main">
        <section class="home">
            <div class="quote__container container">
                <div class="quote__card">
                    <blockquote class="quote__text">
                        "The only way to do great work is to love what you do."
                    </blockquote>
                    <cite class="quote__author">- Steve Jobs</cite>
                </div>
                <form>
                    <button class="button">Generate</button>
                </form>
            </div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
