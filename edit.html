<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Quote - Fancy Daily Quote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar__logo">Quotastic</div>
            <ul class="sidebar__nav">
                <li><a href="index.html" class="sidebar__link"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="dashboard.html" class="sidebar__link"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="create.html" class="sidebar__link"><i class="fas fa-plus-square"></i> Create</a></li>
            </ul>
        </aside>

        <main class="dashboard__main">
            <section class="form-section">
                <div class="form-container">
                    <h1 class="form-title">Edit Quote</h1>
                    <form class="quote-form">
                        <div class="form-group">
                            <label for="quoteText">Quote Text</label>
                            <textarea id="quoteText" name="quoteText" rows="6">"The greatest glory in living lies not in never falling, but in rising every time we fall."</textarea>
                        </div>
                        <div class="form-group">
                             <label for="quoteAuthor">Author</label>
                             <input type="text" id="quoteAuthor" name="quoteAuthor" value="Nelson Mandela">
                        </div>
                        <button type="submit" class="button">Save Changes</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
